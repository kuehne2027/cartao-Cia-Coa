<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Banco Lenel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<style>
/* Layout: nav de vidro fixa (estilo Apple) + bento de indicadores + painel por aba. Mesma família visual do Aduana ao Vivo. */
:root{
  color-scheme:light;
  --bg:#EEF1F4; --surface:#FFFFFF; --surface-2:#F5F7F9; --line:#D7DDE4; --line-2:#E6EAEF;
  --ink:#111C26; --ink-2:#465463; --ink-3:#77838F;
  --accent:#0F4C81; --accent-ink:#FFFFFF; --accent-soft:#E1EBF5;
  --ok:#177E4C; --ok-bg:#E2F2E9; --warn:#A96A06; --warn-bg:#FBEFD6;
  --crit:#C0352B; --crit-bg:#FBE5E2; --run:#1F6FD1; --run-bg:#E3EDFB; --idle:#7C8995; --idle-bg:#EBEEF2;
  --glass:rgba(255,255,255,.66); --glass-line:rgba(17,28,38,.08);
  --blob-a:rgba(15,76,129,.16); --blob-b:rgba(31,111,209,.10); --blob-c:rgba(23,126,76,.08);
  --shadow:0 1px 2px rgba(17,28,38,.06),0 8px 24px rgba(17,28,38,.06);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B1116; --surface:#151D25; --surface-2:#1A242E; --line:#2A3642; --line-2:#222D38;
    --ink:#E6EDF3; --ink-2:#A5B2BE; --ink-3:#74828F;
    --accent:#5FA3E6; --accent-ink:#08131D; --accent-soft:#132A40;
    --ok:#44C285; --ok-bg:#11301F; --warn:#E3A73A; --warn-bg:#33260C;
    --crit:#F26B5F; --crit-bg:#3B1714; --run:#63A3F2; --run-bg:#13263D; --idle:#7F8D9A; --idle-bg:#1E2832;
    --glass:rgba(21,29,37,.62); --glass-line:rgba(255,255,255,.07);
    --blob-a:rgba(95,163,230,.14); --blob-b:rgba(99,163,242,.07); --blob-c:rgba(68,194,133,.06);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B1116; --surface:#151D25; --surface-2:#1A242E; --line:#2A3642; --line-2:#222D38;
  --ink:#E6EDF3; --ink-2:#A5B2BE; --ink-3:#74828F;
  --accent:#5FA3E6; --accent-ink:#08131D; --accent-soft:#132A40;
  --ok:#44C285; --ok-bg:#11301F; --warn:#E3A73A; --warn-bg:#33260C;
  --crit:#F26B5F; --crit-bg:#3B1714; --run:#63A3F2; --run-bg:#13263D; --idle:#7F8D9A; --idle-bg:#1E2832;
  --glass:rgba(21,29,37,.62); --glass-line:rgba(255,255,255,.07);
  --blob-a:rgba(95,163,230,.14); --blob-b:rgba(99,163,242,.07); --blob-c:rgba(68,194,133,.06);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;min-height:100vh;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(40vw 40vw at 8% 0%,var(--blob-a),transparent 70%),
             radial-gradient(35vw 35vw at 100% 12%,var(--blob-b),transparent 70%),
             radial-gradient(45vw 30vw at 60% 100%,var(--blob-c),transparent 70%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono)} .num{font-variant-numeric:tabular-nums}
.disp{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.wrap{max-width:1320px;margin:0 auto;padding-inline:16px}

/* nav de vidro */
.nav{position:sticky;top:0;z-index:30;background:var(--glass);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);border-bottom:1px solid var(--glass-line)}
.nav-in{display:flex;align-items:center;gap:14px;min-height:56px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.brand h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.live{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;color:var(--ink-2);letter-spacing:.06em}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 1.8s infinite}
.live.demo .dot{background:var(--warn)} .live.off .dot{background:var(--idle);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;border:0;background:none;padding:8px 12px;border-radius:8px;font-size:13px;font-weight:500;color:var(--ink-2);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:color .15s,background .15s}
.tab:hover{color:var(--ink);background:var(--surface-2)}
.tab.on{color:var(--ink);background:var(--surface);box-shadow:var(--shadow)}
.tab .cnt{font-family:var(--f-mono);font-size:10.5px;min-width:18px;padding:1px 5px;border-radius:999px;background:var(--crit);color:#fff;text-align:center}
.tab .cnt.z{display:none}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;transition:transform .12s}
.iconbtn:hover{transform:scale(1.05)} .iconbtn:active{transform:scale(.94)}
@media (max-width:760px){.tabs{order:3;width:100%;padding-bottom:8px}}

/* botões táteis */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 13px;font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:7px;justify-content:center;transition:transform .12s ease,box-shadow .15s,border-color .15s,filter .15s;white-space:nowrap}
a.btn{text-decoration:none;color:inherit}
.btn:hover{transform:scale(1.02);border-color:var(--ink-3)}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.danger{color:var(--crit)} .btn.danger:hover{border-color:var(--crit)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.small{padding:5px 10px;font-size:12px;border-radius:8px}
.btn[disabled]{opacity:.5;pointer-events:none}
@media (prefers-reduced-motion:reduce){.btn,.iconbtn{transition:none}.btn:hover,.btn:active,.iconbtn:hover{transform:none}.dot{animation:none}}

/* bento */
.bento{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:14px}
.cell.big .toolbar{flex-wrap:nowrap}
.brand h1{white-space:nowrap}
@media (max-width:520px){.brand h1{font-size:19px}.live{display:none}}
.cell{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--glass-line);border-radius:12px;padding:9px 12px;box-shadow:var(--shadow);min-width:0;display:flex;flex-direction:column;justify-content:center}
.cell.big{flex-direction:row;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cell .l{font-size:10.5px;letter-spacing:.025em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;gap:6px;white-space:nowrap;white-space:normal;overflow:visible}
.cell .l i{width:7px;height:7px;border-radius:2px;display:inline-block;flex:none}
.cell .row{display:flex;align-items:baseline;gap:8px;margin-top:2px;min-width:0}
.cell .v{font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.cell .s{font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cell .toolbar{gap:6px}
@media (max-width:1000px){.bento{grid-template-columns:repeat(2,minmax(0,1fr))}.cell.big{grid-column:span 2}}

/* painel */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-top:16px;min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;flex-wrap:wrap;padding:16px 18px;border-bottom:1px solid var(--line-2)}
.ph h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.ph h2 .c{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);letter-spacing:0;font-weight:400;text-transform:none}
.ph p{margin:2px 0 0;color:var(--ink-2);font-size:12.5px}
.pb{padding:16px 18px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:7px 11px;width:240px;max-width:100%}
@media (max-width:640px){.search{width:100%}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12.5px;display:inline-flex;gap:6px;align-items:center;transition:transform .12s}
.chip:active{transform:scale(.95)}
.chip b{font-family:var(--f-mono);font-weight:500;color:var(--ink-3);font-size:11.5px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)} .chip.on b{color:inherit;opacity:.75}

.tablebox{overflow:auto;max-height:620px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
th{position:sticky;top:0;background:var(--surface-2);color:var(--ink-2);font-weight:500;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
td{padding:9px 12px;border-bottom:1px solid var(--line-2);white-space:nowrap;font-variant-numeric:tabular-nums;vertical-align:middle}
tbody tr{transition:background .12s} tbody tr:hover td{background:var(--surface-2)}
td.name{font-weight:500;white-space:normal;min-width:180px}
td.r,th.r{text-align:right}
.cardno{font-family:var(--f-mono);font-weight:600;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:6px}
.muted{color:var(--ink-3)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:500;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-warn{background:var(--warn-bg);color:var(--warn)}
.p-crit{background:var(--crit-bg);color:var(--crit)} .p-run{background:var(--run-bg);color:var(--run)} .p-idle{background:var(--idle-bg);color:var(--idle)}
.empty{padding:36px 18px;text-align:center;color:var(--ink-3)}
.empty strong{display:block;color:var(--ink-2);font-size:14px;margin-bottom:4px}

/* pedidos em cards */
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.pcard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);display:flex;flex-direction:column;gap:10px;transition:border-color .15s,box-shadow .15s,transform .15s;min-width:0}
.pcard:hover{border-color:var(--ink-3);box-shadow:var(--shadow);transform:translateY(-1px)}
.pcard.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.pcard .top{display:flex;gap:10px;align-items:flex-start}
.pcard .nm{font-weight:600;font-size:14.5px;line-height:1.25;word-break:break-word}
.pcard dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:12.5px}
.pcard dt{color:var(--ink-3)} .pcard dd{margin:0;font-family:var(--f-mono);text-align:right;overflow:hidden;text-overflow:ellipsis}
.pcard .acts{display:flex;gap:6px;flex-wrap:wrap}
.pcard .acts .btn{flex:1}
table.plain td{padding:4px 12px}
table.plain td .btn.small{padding:4px 9px}
table.plain td.name{min-width:200px}
tr.selr td{background:var(--accent-soft)!important}
.erow{padding:8px 18px!important}
.flag{font-size:12px;background:var(--warn-bg);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:8px;padding:6px 9px}
.flag b{color:var(--warn)}
.ck{width:18px;height:18px;accent-color:var(--accent);margin-top:2px;flex:none}

/* link de cadastro */
.linkbox{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);border-radius:12px;padding:10px 12px}
.linkbox code{flex:1;min-width:0;font-family:var(--f-mono);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}

/* envio */
.erow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line-2)}
.erow:last-child{border-bottom:0}
.erow .who .nm{font-weight:600}
.erow .who .sub{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);margin-top:2px}
.erow .done{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.erow input{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 9px;width:130px;font-family:var(--f-mono)}
@media (max-width:820px){.erow{grid-template-columns:1fr}.erow .done{justify-content:flex-start}}
.dest{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:12.5px;color:var(--ink-2)}
.dest b{color:var(--ink);font-family:var(--f-mono);font-weight:500}

/* compositor de e-mail */
.compose{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.c-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 14px;background:var(--ink);color:var(--bg);font-weight:600;font-size:13px}
.c-count{font-family:var(--f-mono);font-weight:500;font-size:12px;opacity:.85}
.c-row{display:flex;align-items:flex-start;gap:10px;padding:6px 14px;border-bottom:1px solid var(--line-2);min-height:40px}
.c-row>label{width:58px;flex:none;color:var(--ink-3);font-size:13px;padding-top:6px}
.c-from{padding-top:6px;font-size:13px;color:var(--ink-2);min-width:0}
.c-from b{color:var(--ink);font-weight:500}
.c-input{flex:1;min-width:0;border:0;background:transparent;padding:6px 0;font-weight:500}
.c-input:focus{outline:none}
.chipbox{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:3px 0}
.chipbox input{flex:1;min-width:180px;border:0;background:transparent;padding:4px 0}
.chipbox input:focus{outline:none}
.mchip{display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:999px;padding:2px 4px 2px 10px;font-size:12.5px;max-width:100%}
.mchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mchip button{border:0;background:transparent;width:18px;height:18px;border-radius:50%;line-height:1;color:var(--ink-2);padding:0}
.mchip button:hover{background:color-mix(in srgb,var(--ink) 12%,transparent)}
.mchip.bad{background:var(--crit-bg);border-color:var(--crit)}
.c-body{padding:10px 14px;display:flex;flex-direction:column;gap:8px}
#cClose{min-height:24px}
.c-body textarea{border:0;background:transparent;resize:vertical;width:100%;padding:0;line-height:1.5}
.c-body textarea:focus{outline:none}
.c-preview{border:1px dashed var(--line);border-radius:10px;overflow:auto;max-height:260px;background:var(--surface-2)}
.c-preview table{font-size:12.5px}
.c-preview td,.c-preview th{padding:4px 10px}
.c-preview .none{padding:18px;text-align:center;color:var(--ink-3);font-size:13px}
.c-foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 14px;border-top:1px solid var(--line-2);background:var(--surface-2)}
tr.esel td{background:color-mix(in srgb,var(--accent-soft) 70%,transparent)}

/* configurações */
h3.sub{margin:0;font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.asst-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.asst-row{display:grid;grid-template-columns:32px minmax(0,1fr) minmax(0,1.3fr) 100px auto;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line-2)}
.asst-row:last-child{border-bottom:0}
.asst-av{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:12px}
.asst-row .em{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis}
.asst-empty{padding:14px;color:var(--ink-3);font-size:13px;text-align:center}
.asst-add{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) 150px auto;gap:10px;align-items:end}
@media (max-width:640px){.asst-add{grid-template-columns:1fr}.asst-row{grid-template-columns:32px minmax(0,1fr) auto}.asst-row .em{grid-column:2}}
.c-from{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:0!important}
.c-from .selwrap select{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 34px 6px 10px;font-weight:500;min-width:240px;max-width:100%}
.c-from .selwrap select:focus{outline:none;border-color:var(--accent)}
.c-from .ccme{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--ink-2)}
.c-from .ccme input{width:15px;height:15px;accent-color:var(--accent)}

.logo-box{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.logo-prev{min-width:200px;height:64px;border:1px dashed var(--line);border-radius:10px;background:#fff;display:grid;place-items:center;padding:8px 14px;color:#77838F;font-size:12px}
.logo-prev img{max-height:44px;max-width:220px;display:block}

/* aba formulário */
.formgrid{display:grid;grid-template-columns:minmax(0,480px) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:980px){.formgrid{grid-template-columns:1fr}}
.formprev{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg)}
.fp-h{font-size:12px;color:var(--ink-2);padding:8px 12px;border-bottom:1px solid var(--line-2);background:var(--surface-2)}
#formFrame{width:100%;height:860px;border:0;display:block;background:var(--bg)}
.feed{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.feed-h{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line-2);background:var(--surface-2)}
.frow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:9px 14px;border-bottom:1px solid var(--line-2);align-items:center}
.frow:last-child{border-bottom:0}
.frow .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .sub{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);grid-column:1}
.frow .tags{display:flex;gap:5px;justify-content:flex-end;flex-wrap:wrap;grid-row:1/3;grid-column:2}
.frow.new{animation:flash 2.4s ease}
@keyframes flash{0%{background:var(--ok-bg)}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){.frow.new{animation:none}}

/* formulários */

function grootPorNome(nomeTxt){
  const ix = grootIdx(), k = normKey(nomeTxt);

function bancoStatus(c){
  const p = S.pedidos.find(x => x.cpf === c.cpf && (x.status === "pendente" || x.status === "aprovado"));
  if (p) return p.status === "pendente" ? `<span class="pill p-crit">Pendente${/2ª/.test(p.motivo || "") ? " · 2ª via" : ""}</span>` : `<span class="pill p-run">Com o setor</span>`;

  const tem = S.pedidos.some(x => x.cpf === c.cpf && x.motivo === "Tenho cartão");

let sb = null, busy = false;
async function load(){
  if (busy || !sb) return; busy = true;
  try {
    const [c, p, g1, g2] = await Promise.all([
      sb.from("lenel_cartoes").select("id,nome,cpf,ext,cartao,selfie_data,created_at,updated_at").limit(5000),
      sb.from("lenel_pedidos").select("cpf,status,motivo").limit(5000),
      sb.from("lenel_config").select("key,value").eq("key", "groot_lista"),
      sb.from("lenel_config").select("key,value").like("key", "groot_id:%").limit(5000)
    ]);
    if (c.error) throw c.error;
    S.cartoes = c.data || []; S.pedidos = p.error ? [] : (p.data || []);
    S.cfg = Object.fromEntries([...(g1.error ? [] : g1.data || []), ...(g2.error ? [] : g2.data || [])].map(r => [r.key, r.value]));
    S.loaded = true;
    $("#errBanner").hidden = true; setLive("ok", "AO VIVO"); if (!editing()) render();
  } catch (e) {
    $("#errText").textContent = (e && (e.message || e.code)) || "Erro desconhecido"; $("#errBanner").hidden = false; setLive("off", "SEM CONEXÃO");
    if (!S.loaded) { S.loaded = true; render(); }
  } finally { busy = false; }
}

$("#bancoChips").onclick = e => { const b = e.target.closest(".chip"); if (!b) return; S.bf = b.dataset.bf; $$("#bancoChips .chip").forEach(x => x.classList.toggle("on", x === b)); render(); };
function closeSheet(){}
function editing(){ const a = document.activeElement; return a && a.classList && a.classList.contains("cardin") && a.value !== (S.cartoes.find(x => x.id === a.dataset.id)?.cartao || ""); }
async function saveCard(inp){
  const c = S.cartoes.find(x => x.id === inp.dataset.id); if (!c || !sb) return;
  const msg = document.querySelector(`[data-msg="${CSS.escape(c.id)}"]`);
  const cartao = inp.value.trim();
  if (cartao === (c.cartao || "")) { inp.classList.remove("dirty","bad"); return; }
  const show = (t, cls) => { if (msg) { msg.textContent = t; msg.className = "cardmsg " + (cls || ""); } };
  if (cartao && !/^\d{3,12}$/.test(cartao)) { inp.classList.add("bad"); return show("Só números", "err"); }
  const dup = cartao && S.cartoes.find(x => x.cartao === cartao && x.id !== c.id);
  if (dup) { inp.classList.add("bad"); return show("Já é de " + dup.nome, "err"); }
  inp.disabled = true; show("Salvando…");
  try {
    const { data, error } = await sb.from("lenel_cartoes").update({ cartao, updated_at: new Date().toISOString() }).eq("id", c.id).select("id,cartao,updated_at");
    if (error) throw error;
    if (!data || !data.length) throw new Error("sem permissão para editar");
    c.cartao = data[0].cartao; c.updated_at = data[0].updated_at;
    inp.classList.remove("dirty","bad"); inp.disabled = false; show("✓ Salvo", "ok"); toast("Cartão de " + c.nome + " salvo");
    setTimeout(() => { if (!editing()) render(); }, 1500);
  } catch (e) { inp.disabled = false; inp.classList.add("bad"); show("Não salvou: " + ((e && (e.message || e.code)) || "erro"), "err"); }
}
$("#bancoBody").addEventListener("input", e => { if (!e.target.classList.contains("cardin")) return; const c = S.cartoes.find(x => x.id === e.target.dataset.id); e.target.classList.toggle("dirty", e.target.value.trim() !== (c?.cartao || "")); e.target.classList.remove("bad"); });
$("#bancoBody").addEventListener("keydown", e => { if (e.target.classList.contains("cardin") && e.key === "Enter") { e.preventDefault(); saveCard(e.target); } if (e.target.classList.contains("cardin") && e.key === "Escape") { const c = S.cartoes.find(x => x.id === e.target.dataset.id); e.target.value = c?.cartao || ""; e.target.classList.remove("dirty","bad"); e.target.blur(); } });
$("#bancoBody").addEventListener("focusout", e => { if (e.target.classList.contains("cardin") && !e.target.disabled) saveCard(e.target); });
$("#bancoBody").onclick = e => { const b = e.target.closest(".photo-btn"); if (!b) return; const c = S.cartoes.find(x => x.id === b.dataset.id); if (!c) return; $("#viewerImg").src = c.selfie_data; $("#viewerImg").alt = "Foto de " + c.nome; $("#viewerCap").textContent = c.nome; $("#viewer").hidden = false; $("#viewerClose").focus(); };
$("#viewerClose").onclick = () => $("#viewer").hidden = true;
$("#viewer").onclick = e => { if (e.target.id === "viewer") $("#viewer").hidden = true; };
addEventListener("keydown", e => { if (e.key === "Escape") { $("#viewer").hidden = true; closeSheet(); } });
$("#errRetry").onclick = load;
(function theme(){
  let saved = null; try { saved = localStorage.getItem("lenel_theme"); } catch {}
  if (saved) document.documentElement.dataset.theme = saved;
  $("#themeBtn").onclick = () => {
    const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const nx = cur === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = nx; try { localStorage.setItem("lenel_theme", nx); } catch {}
  };
})();

render();
if (!window.supabase) { $("#errText").textContent = "A conexão com o Supabase não carregou. Verifique a internet."; $("#errBanner").hidden = false; setLive("off","SEM CONEXÃO"); S.loaded = true; render(); }
else {
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  load();
  try { sb.channel("lenel-consulta").on("postgres_changes",{event:"*",schema:"public",table:"lenel_cartoes"},()=>load()).on("postgres_changes",{event:"*",schema:"public",table:"lenel_pedidos"},()=>load()).on("postgres_changes",{event:"*",schema:"public",table:"lenel_config"},()=>load()).subscribe(); } catch {}
  setInterval(() => { if (!document.hidden) load(); }, 30000);
}
</script>
</body>
</html>
